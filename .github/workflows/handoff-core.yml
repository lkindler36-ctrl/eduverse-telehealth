name: Fictional handoff contract

on:
  pull_request:
    paths:
      - 'src/lib/eduverse/handoff-core.mjs'
      - 'src/lib/eduverse/handoff-json-file-store.mjs'
      - 'scripts/handoff-core.test.mjs'
      - '.github/workflows/handoff-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run fictional handoff tests
        run: node scripts/handoff-core.test.mjs
