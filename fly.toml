app = "eduverse-telehealth"
primary_region = "atl"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  APP_VERSION = "1.0.0"
  SEED_ON_BOOT = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
